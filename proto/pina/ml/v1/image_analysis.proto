syntax = "proto3";

package pina.ml.v1;

import "pina/ml/v1/common.proto";

option java_package = "dev.pina.ml.v1";
option java_multiple_files = true;
option java_outer_classname = "ImageAnalysisProto";

// Phase 4 is photo-first, but the contract stays media-agnostic so that
// keyframe-based video analysis (Phase 7) fits without a protocol redesign.
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  PHOTO = 1;
  VIDEO_KEYFRAME = 2;
}

message MediaContext {
  MediaKind kind = 1;
  // Backend UUID of the source media item (photo now, video later).
  string media_id = 2;
  // Keyframe ordinal within the source video; 0 for photos.
  uint32 frame_index = 3;
  // Keyframe position within the source video; 0 for photos.
  uint64 frame_timestamp_ms = 4;
}

// An already-derived analysis variant (compressed or thumbnail rendition).
// Originals are never required for analysis.
message ImageInput {
  bytes data = 1;
  // IANA media type of data, e.g. "image/jpeg".
  string mime_type = 2;
}

message AnalyzeImageRequest {
  // Correlation and idempotency id chosen by the caller.
  string request_id = 1;
  MediaContext media = 2;
  ImageInput image = 3;
  // Steps to run. Empty means all steps enabled by the active profile.
  repeated AnalysisStep steps = 4;
}

message Tag {
  string label = 1;
  // Classifier confidence in [0, 1].
  float confidence = 2;
}

// Coordinates normalized to [0, 1] relative to the analyzed image.
message NormalizedBoundingBox {
  // Left edge.
  float x = 1;
  // Top edge.
  float y = 2;
  float width = 3;
  float height = 4;
}

message FaceDetection {
  NormalizedBoundingBox box = 1;
  // Detector confidence in [0, 1].
  float confidence = 2;
  // Face descriptor used for clustering; absent when FACE_EMBEDDING was
  // skipped or failed. Named "embedding" because protobuf-java reserves
  // getDescriptor().
  Embedding embedding = 3;
}

message AnalyzeImageResponse {
  // Echo of AnalyzeImageRequest.request_id.
  string request_id = 1;
  // One entry per requested (or profile-enabled) step.
  repeated StepResult step_results = 2;
  // Present when IMAGE_EMBEDDING completed.
  Embedding image_embedding = 3;
  // Present when TAGGING completed.
  repeated Tag tags = 4;
  // Present when FACE_DETECTION completed.
  repeated FaceDetection faces = 5;
}

message EmbedTextRequest {
  string text = 1;
}

message EmbedTextResponse {
  Embedding embedding = 1;
  ModelRef model = 2;
}

message GetServiceStatusRequest {
}

// Redistribution and usage terms for a model's underlying weights, surfaced so
// operators can see which artifacts are non-commercial or must not be bundled.
message License {
  // SPDX identifier, e.g. "MIT", "Apache-2.0", or "NonCommercial".
  string spdx = 1;
  string url = 2;
  bool commercial_use = 3;
  bool allow_bundling = 4;
  string notes = 5;
}

// Active runtime profile detail: model-selection limits plus the ordered ONNX
// execution providers. Set via environment and applied on service restart.
message RuntimeProfile {
  string name = 1;
  uint32 max_parallel_analyses = 2;
  uint32 analysis_max_resolution = 3;
  repeated string execution_providers = 4;
}

// One read-only inference knob sourced from a PINA_ML_* setting.
message InferenceSetting {
  // Environment variable name, e.g. "PINA_ML_TAG_TOP_K".
  string key = 1;
  // Short human label, e.g. "tag_top_k".
  string label = 2;
  string value = 3;
}

message ModelAvailability {
  ModelRef model = 1;
  // The pipeline step this model serves.
  AnalysisStep step = 2;
  // True when the manifest resolved and the artifact is cached and loadable.
  bool available = 3;
  // Redistribution/usage terms of the underlying weights.
  License license = 4;
}

message GetServiceStatusResponse {
  string service_version = 1;
  // Active runtime profile, e.g. "default" or "cpu-lite".
  string active_profile = 2;
  // True when every model required by the active profile is available.
  bool ready = 3;
  repeated ModelAvailability models = 4;
  // Active profile detail: selection limits and execution providers.
  RuntimeProfile profile = 5;
  // Read-only PINA_ML_* inference knobs, for operator visibility.
  repeated InferenceSetting inference_settings = 6;
}

// Image analysis service for the backend-to-ML boundary. Photos and, later,
// video keyframes go through the same RPC; MediaContext.kind disambiguates.
//
// Liveness and readiness probing additionally uses the standard
// grpc.health.v1.Health service, provided by gRPC runtime libraries on both
// sides and therefore not vendored into this contract.
service ImageAnalysis {
  // Analyze a single derived image. Per-step failures are reported in
  // step_results; the RPC itself fails only for transport- or request-level
  // errors (e.g. undecodable payload).
  rpc AnalyzeImage(AnalyzeImageRequest) returns (AnalyzeImageResponse);

  // Embed a text query into the same vector space as image embeddings.
  // Reserved for semantic text search wiring; servers may respond with
  // UNIMPLEMENTED until that lands.
  rpc EmbedText(EmbedTextRequest) returns (EmbedTextResponse);

  // Application-level status: active profile and per-model availability.
  rpc GetServiceStatus(GetServiceStatusRequest) returns (GetServiceStatusResponse);
}
