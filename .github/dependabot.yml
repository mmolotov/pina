version: 2

updates:
  # Backend (Gradle)
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # Supply-chain soak: hold new versions before opening a bump PR.
    # Majors soak longer (breakage + more time to surface issues).
    # Security updates are exempt and still open immediately.
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels: [dependencies, backend]
    commit-message:
      prefix: "deps(backend):"
    open-pull-requests-limit: 10

  # Frontend (npm)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels: [dependencies, frontend]
    commit-message:
      prefix: "deps(frontend):"
    open-pull-requests-limit: 10
    # Node types must track the Node LTS the project runs on (currently 24),
    # not the newest Node major.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ML service (Python, uv.lock)
  - package-ecosystem: uv
    directory: /ml
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels: [dependencies, ml]
    commit-message:
      prefix: "deps(ml):"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(ci):"
    open-pull-requests-limit: 5
