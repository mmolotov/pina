name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'docs/adr.adoc'
      - 'README.md'
      - 'MILESTONES.md'
      - 'backlog/tasks/**'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'docs/adr.adoc'
      - 'README.md'
      - 'MILESTONES.md'
      - 'backlog/tasks/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    runs-on: ubuntu-latest
    # Without a cap a hung step (e.g. `playwright install --with-deps` stalling on
    # an apt lock) runs to the 6h GitHub hard limit. Fail fast instead.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        # `playwright install chromium` pulls three artifacts (Chrome, ffmpeg,
        # headless-shell) from cdn.playwright.dev with no per-download timeout. The
        # Azure-fronted ffmpeg/headless-shell legs intermittently stall after the
        # first artifact downloads — the step then produces no output and only dies
        # at the cap. The cache above lets steady-state runs skip the download
        # entirely; on a cold cache, kill a stalled attempt fast and retry on a
        # fresh connection (install is a no-op when the cache is warm). No
        # `--with-deps`: it shells out to apt, which stalls on the dpkg lock held by
        # unattended-upgrades — ubuntu-latest already ships Chromium's system
        # libraries, so a plain HTTPS download needs no apt.
        run: |
          for attempt in 1 2 3; do
            timeout 150 npx playwright install chromium && exit 0
            echo "::warning::Playwright install attempt $attempt stalled; retrying"
          done
          exit 1
        timeout-minutes: 10

      - name: UI quality gates
        run: npm run check

      - name: Test with coverage
        run: npm run test -- --coverage

      - name: Responsive and visual regression suite
        run: npm run test:e2e

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build:app

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-build
          path: frontend/build/

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-playwright-test-results
          path: frontend/test-results/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
