name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'docs/adr.adoc'
      - 'README.md'
      - 'MILESTONES.md'
      - 'backlog/tasks/**'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'docs/adr.adoc'
      - 'README.md'
      - 'MILESTONES.md'
      - 'backlog/tasks/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    runs-on: ubuntu-latest
    # Without a cap a hung step (e.g. `playwright install --with-deps` stalling on
    # an apt lock) runs to the 6h GitHub hard limit. Fail fast instead.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # No `--with-deps`: it shells out to `apt`, which on hosted runners stalls
        # indefinitely on the dpkg lock held by unattended-upgrades (the step then
        # produces no output and only dies at the timeout). ubuntu-latest already
        # ships Chromium's system libraries, so a plain browser download — HTTPS,
        # no apt, no lock — is reliable. The cap stays as a backstop.
        run: npx playwright install chromium
        timeout-minutes: 10

      - name: UI quality gates
        run: npm run check

      - name: Test with coverage
        run: npm run test -- --coverage

      - name: Responsive and visual regression suite
        run: npm run test:e2e

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build:app

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-build
          path: frontend/build/

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-playwright-test-results
          path: frontend/test-results/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
