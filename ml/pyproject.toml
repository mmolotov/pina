[project]
name = "pina-ml"
version = "0.1.0"
description = "PINA ML service: photo analysis over gRPC with a FastAPI admin surface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",
    "protobuf>=5.27",
    "pydantic-settings>=2.4",
]

[project.scripts]
pina-ml = "pina_ml.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "grpcio-tools>=1.66",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pina_ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated gRPC modules are not subject to project lint/format rules.
extend-exclude = ["src/pina"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
