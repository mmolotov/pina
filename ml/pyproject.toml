[project]
name = "pina-ml"
version = "0.1.0"
description = "PINA ML service: photo analysis over gRPC with a FastAPI admin surface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.50.1",
    "grpcio>=1.83.0",
    "grpcio-health-checking>=1.66",
    "protobuf>=7.35.1",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "onnxruntime>=1.27.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "tokenizers>=0.20",
]

[project.scripts]
pina-ml = "pina_ml.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "grpcio-tools>=1.66",
    "ruff>=0.15.20",
    "onnx>=1.22.0",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pina_ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=pina_ml --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated gRPC modules are not subject to project lint/format rules.
extend-exclude = ["src/pina"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/pina_ml", "tests", "scripts"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Generated gRPC modules: typed via the generated .pyi where present, but the
# *_pb2_grpc.py bodies are untyped - do not follow into them.
[[tool.mypy.overrides]]
module = "pina.*"
ignore_missing_imports = true
follow_imports = "skip"

# Third parties without type information.
[[tool.mypy.overrides]]
module = ["grpc.*", "grpc_health.*", "onnxruntime", "onnx.*", "tokenizers"]
ignore_missing_imports = true
