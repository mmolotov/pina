id: clip-vit-b32-text-int8
version: "1.0"
step: tagging
runtime: onnxruntime
license:
  spdx: MIT
  url: https://github.com/openai/CLIP/blob/main/LICENSE
  commercial_use: true
  allow_bundling: true
  notes: >-
    Dynamically quantized int8 ONNX export (Xenova/clip-vit-base-patch32) of
    openai/clip-vit-base-patch32; smaller and faster on weak CPUs at a small
    accuracy cost.
files:
  - name: text_model_quantized.onnx
    url: https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/text_model_quantized.onnx
  - name: tokenizer.json
    url: https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/tokenizer.json
input:
  max_token_length: 77
output:
  embedding_dim: 512
